<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found // omerdev</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-grid"></div>
    <div class="app-container" style="justify-content: center; align-items: center; text-align: center; padding: 2rem;">
        <div class="terminal-card" style="max-width: 500px; width: 100%;">
            <div class="terminal-header">
                <span class="terminal-dot dot-red"></span>
                <span class="terminal-dot dot-yellow"></span>
                <span class="terminal-dot dot-green"></span>
                <span class="terminal-title">404 - NOT_FOUND</span>
            </div>
            <div class="terminal-body" style="padding: 2.5rem 1.5rem; gap: 1.5rem;">
                <h1 style="color: var(--accent-red); font-size: 3rem;">404</h1>
                <p style="color: var(--text-secondary);">The requested route does not exist or has moved.</p>
                <div>
                    <a href="index.html#home" class="btn btn-primary">Return to Home</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
